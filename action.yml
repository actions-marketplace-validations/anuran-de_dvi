# DVI derives candidate change events from the commits in the PR range (in
# addition to any [[changes]] declared in dvi.toml), so the calling workflow's
# checkout step must fetch full history — a shallow checkout leaves no commit
# range to derive from:
#
#   - uses: actions/checkout@v4
#     with:
#       fetch-depth: 0        # DVI derives change events from commit history
#   - uses: anuran-de/dvi@v1
#
# The referenced dvi.toml may declare a single asset or an [[assets]] list. For a
# multi-asset config the sticky comment carries the aggregated report and the
# gate reflects the worst severity across all assets; the `<!-- dvi-report -->`
# marker stays on the first line, so the comment-update step below is unchanged.
#
name: "DVI semantic data-change report"
description: "Run DVI on a pull request and post a semantic-data-change report."
author: "Anuran De"
branding:
  icon: "activity"
  color: "purple"
inputs:
  config:
    description: "Path to the dvi.toml config file."
    required: false
    default: "dvi.toml"
  output-dir:
    description: "Directory for the rendered report artifacts."
    required: false
    default: ".dvi"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install DVI
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Run DVI analyze
      id: dvi
      shell: bash
      run: |
        set +e
        dvi analyze --config "${{ inputs.config }}" --output-dir "${{ inputs.output-dir }}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
    - name: Post sticky PR comment
      if: ${{ github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        marker="<!-- dvi-report -->"
        body_file="${{ inputs.output-dir }}/dvi-report.md"
        repo="${{ github.repository }}"
        pr="${{ github.event.pull_request.number }}"
        existing=$(gh api "repos/$repo/issues/$pr/comments" \
          --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -F body=@"$body_file"
        else
          gh api -X POST "repos/$repo/issues/$pr/comments" -F body=@"$body_file"
        fi
    - name: Enforce gate
      shell: bash
      run: exit ${{ steps.dvi.outputs.exit_code }}
